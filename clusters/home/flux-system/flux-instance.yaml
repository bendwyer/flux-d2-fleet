---
# yaml-language-server: $schema=https://raw.githubusercontent.com/CustomResourceDefinition/catalog/refs/heads/main/schema/fluxcd.controlplane.io/fluxinstance_v1.json
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.x"
    registry: "ghcr.io/fluxcd"
    # Without this the operator uses the manifests baked into its own image, so
    # Flux patch releases would only arrive when the operator itself updates.
    artifact: "oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests:latest"
  # Whole-list replacement, so the four defaults are named alongside the addition.
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
    - source-watcher
  cluster:
    domain: cluster.local
  sync:
    kind: OCIRepository
    url: "oci://ghcr.io/bendwyer/d2-fleet"
    ref: "latest"
    path: "clusters/home"
